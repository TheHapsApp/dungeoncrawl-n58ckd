<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dungeon Crawl</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root{ --p1:#3a2a5c; --p2:#6a3fb5; --p3:#2fae6b; --p4:#ffb703; }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
    min-height:100vh; color:#2a2040; text-align:center;
    background:linear-gradient(120deg,var(--p1),var(--p2),var(--p3),var(--p4));
    background-size:400% 400%; animation:flow 18s ease infinite;
    padding:20px 12px 40px; overflow-x:hidden;
  }
  @keyframes flow{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
  h1{ font-size:clamp(1.7rem,7vw,2.4rem); color:#fff; text-shadow:3px 3px 0 rgba(0,0,0,0.25); }
  h2{ font-size:clamp(1.3rem,5.5vw,1.8rem); color:#fff; text-shadow:2px 2px 0 rgba(0,0,0,0.25); margin:4px 0 12px; }
  .sub{ font-size:0.95rem; color:#fff; opacity:0.9; margin:4px 0 18px; text-shadow:1px 1px 0 rgba(0,0,0,0.2); }
  .screen{display:none;} .screen.active{display:block;}
  button{font-family:inherit;}

  .homebtn{
    background:rgba(255,255,255,0.75); border:3px solid #fff; border-radius:999px; color:#2a2040;
    font-weight:bold; padding:8px 18px; font-size:0.9rem; cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,0.2); margin-bottom:12px; transition:transform .08s ease;
  }
  .homebtn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.2);}

  .bigbtn{
    font-size:1rem; padding:13px 22px; border-radius:18px; border:none; cursor:pointer; font-weight:bold; color:#2a2040;
    box-shadow:0 5px 0 rgba(0,0,0,0.25); transition:transform .08s ease;
  }
  .bigbtn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.25);}
  .bigbtn.primary{background:#ffb703; color:#3a2200;}
  .bigbtn.secondary{background:#fff;}
  .bigbtn:disabled{opacity:0.4; cursor:default;}
  .row{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:14px;}

  /* ---- Hub ---- */
  .emeraldPill{
    display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.85); border:3px solid #fff;
    border-radius:999px; padding:6px 16px; font-weight:bold; color:#1a6b3a; font-size:1.05rem;
    box-shadow:0 4px 0 rgba(0,0,0,0.15); margin-bottom:16px;
  }
  .hubStage{
    max-width:340px; margin:0 auto 16px; background:rgba(255,255,255,0.25); border:4px solid #fff;
    border-radius:22px; padding:24px 16px; backdrop-filter:blur(2px);
  }
  #builderBtn{ background:none; border:none; cursor:pointer; }
  #builderBtn:active{ transform:translateY(2px); }
  .builderLabel{ color:#fff; font-weight:bold; margin-top:6px; text-shadow:1px 1px 0 rgba(0,0,0,0.2); }
  .equippedRow{ color:#fff; font-size:0.95rem; margin-top:10px; text-shadow:1px 1px 0 rgba(0,0,0,0.2); }

  /* ---- Shop overlay ---- */
  .overlay{
    display:none; position:fixed; inset:0; z-index:50; background:rgba(20,10,40,0.92);
    align-items:center; justify-content:center; flex-direction:column; gap:10px; padding:20px; overflow-y:auto;
  }
  .overlay.show{display:flex;}
  .shopList{ width:100%; max-width:360px; display:flex; flex-direction:column; gap:10px; margin:10px 0; }
  .shopItem{
    display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.9); border:3px solid #fff;
    border-radius:16px; padding:10px 14px; text-align:left;
  }
  .shopItem .icon{ font-size:1.8rem; width:40px; text-align:center; }
  .shopItem .info{ flex:1; }
  .shopItem .wname{ font-weight:bold; color:#2a2040; }
  .shopItem .wstats{ font-size:0.78rem; color:#555; }
  .shopItem button{
    border:none; border-radius:12px; padding:8px 12px; font-weight:bold; cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,0.2); font-size:0.85rem;
  }
  .shopItem .buyBtn{ background:#ffb703; color:#3a2200; }
  .shopItem .buyBtn:disabled{ background:#ccc; color:#777; cursor:default; box-shadow:none; }
  .shopItem .equipBtn{ background:#2fae6b; color:#fff; }
  .shopItem .equipBtn.equipped{ background:#fff; color:#2fae6b; outline:3px solid #2fae6b; }

  /* ---- Dungeon ---- */
  #dungeonWrap{
    width:100%; max-width:340px; aspect-ratio:4/5; margin:0 auto; border:4px solid #fff;
    border-radius:18px; overflow:hidden; position:relative; box-shadow:0 6px 0 rgba(0,0,0,0.2);
  }
  #dungeonCanvas{ width:100%; height:100%; display:block; touch-action:none; }
  .hud{ position:absolute; top:8px; left:8px; right:8px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; }
  #heartsRow{ display:flex; gap:1px; filter:drop-shadow(1px 1px 0 rgba(0,0,0,0.5)); }
  #waveLabel{
    position:absolute; top:8px; left:50%; transform:translateX(-50%); color:#fff; font-weight:bold;
    font-size:0.85rem; text-shadow:1px 1px 0 rgba(0,0,0,0.6); pointer-events:none;
  }
  #emeraldHud{ color:#fff; font-weight:bold; font-size:0.85rem; text-shadow:1px 1px 0 rgba(0,0,0,0.6); }
  #waveBanner{
    position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); color:#fff; font-weight:bold;
    font-size:1.3rem; text-shadow:2px 2px 0 rgba(0,0,0,0.5); pointer-events:none; opacity:0; transition:opacity .3s ease;
  }
  #waveBanner.show{ opacity:1; }

  .controls{ display:flex; justify-content:space-between; align-items:center; max-width:340px; margin:14px auto 0; }
  .dpad{ display:grid; grid-template-columns:repeat(3,46px); grid-template-rows:repeat(3,46px); gap:4px; }
  .dpad button{
    background:rgba(255,255,255,0.85); border:3px solid #fff; border-radius:12px; font-size:1.2rem;
    cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,0.2);
  }
  .dpad button:active, .dpad button.pressed{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.2); }
  .dpad .up{grid-column:2; grid-row:1;} .dpad .left{grid-column:1; grid-row:2;}
  .dpad .down{grid-column:2; grid-row:2;} .dpad .right{grid-column:3; grid-row:2;}
  #attackBtn{
    width:76px; height:76px; border-radius:50%; background:#ff5f5f; color:#fff; font-size:1.8rem;
    border:4px solid #fff; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,0.25);
  }
  #attackBtn:active, #attackBtn.pressed{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.25); }

  .resultCard{
    max-width:320px; background:rgba(255,255,255,0.95); border:4px solid #fff; border-radius:20px;
    padding:20px 18px; color:#2a2040;
  }
  .resultCard h2{ color:#2a2040; text-shadow:none; }
  .resultCard .rline{ font-size:1rem; margin:6px 0; }

  footer{margin-top:20px; font-size:0.78rem; color:#fff; opacity:0.85; text-shadow:1px 1px 0 rgba(0,0,0,0.15);}
</style>
</head>
<body>

  <!-- ==== HUB ==== -->
  <div class="screen active" id="screen-hub">
    <h1>⚔️ Dungeon Crawl</h1>
    <p class="sub">Fight monsters, collect loot, trade emeralds for gear!</p>
    <div class="emeraldPill">💎 <span id="hubEmeraldCount">0</span> Emeralds</div>
    <div class="hubStage">
      <button id="builderBtn" title="Talk to the Builder">
        <canvas id="builderCanvas" width="90" height="110"></canvas>
        <div class="builderLabel">🧔 Tap the Builder to trade!</div>
      </button>
      <div class="equippedRow">Equipped: <span id="equippedWeaponLabel">Wooden Sword 🗡️</span></div>
    </div>
    <div class="row">
      <button class="bigbtn primary" id="enterDungeonBtn">🚪 Enter the Dungeon</button>
    </div>
  </div>

  <!-- ==== SHOP OVERLAY ==== -->
  <div class="overlay" id="shopOverlay">
    <h2>🧔 The Builder's Trade</h2>
    <div class="emeraldPill">💎 <span id="shopEmeraldCount">0</span> Emeralds</div>
    <div class="shopList" id="shopList"></div>
    <button class="bigbtn secondary" id="shopCloseBtn">✖ Done Trading</button>
  </div>

  <!-- ==== RESULT OVERLAY ==== -->
  <div class="overlay" id="resultOverlay">
    <div class="resultCard">
      <h2 id="resultTitle">Dungeon Complete!</h2>
      <div class="rline" id="resultLine1"></div>
      <div class="rline" id="resultLine2"></div>
      <button class="bigbtn primary" id="resultBackBtn" style="margin-top:14px;">🏠 Back to Hub</button>
    </div>
  </div>

  <!-- ==== DUNGEON ==== -->
  <div class="screen" id="screen-dungeon">
    <button class="homebtn" id="leaveDungeonBtn">🏠 Leave Dungeon</button>
    <div id="dungeonWrap">
      <canvas id="dungeonCanvas" width="320" height="400"></canvas>
      <div class="hud">
        <div id="heartsRow"></div>
        <div id="emeraldHud">💎 0</div>
      </div>
      <div id="waveLabel">Wave 1/3</div>
      <div id="waveBanner"></div>
    </div>
    <div class="controls">
      <div class="dpad">
        <button class="up" data-dir="up">⬆️</button>
        <button class="left" data-dir="left">⬅️</button>
        <button class="down" data-dir="down">⬇️</button>
        <button class="right" data-dir="right">➡️</button>
      </div>
      <button id="attackBtn">⚔️</button>
    </div>
  </div>

  <footer>Made for Ben 🎮</footer>

<script>
// =====================================================================
// DUNGEON CRAWL — a simplified, easier, kid-friendly Minecraft-Dungeons-
// style top-down hack-and-slash. Same broad monster cast as MC Dungeons,
// each given a slightly different twist, plus two fully original ones,
// hearts-based health HUD, item drops from kills, and an emerald-trading
// Builder NPC in the hub for buying new weapons.
// =====================================================================

// ---------- weapons ----------
var WEAPONS = {
  wood:  { id:"wood",  name:"Wooden Sword", emoji:"🗡️", cost:0,  dmg:2, range:48, cooldown:380, ranged:false, color:"#c8965a" },
  stone: { id:"stone", name:"Stone Sword",  emoji:"⚔️", cost:8,  dmg:3, range:50, cooldown:360, ranged:false, color:"#9a9a9a" },
  iron:  { id:"iron",  name:"Iron Sword",   emoji:"🗡️", cost:18, dmg:4, range:52, cooldown:340, ranged:false, color:"#dfe4ea" },
  bow:   { id:"bow",   name:"Golden Bow",   emoji:"🏹", cost:24, dmg:2, range:230, cooldown:500, ranged:true,  color:"#ffd23f" },
  axe:   { id:"axe",   name:"Diamond Axe",  emoji:"🪓", cost:40, dmg:6, range:54, cooldown:540, ranged:false, color:"#6be3ff" },
};
var WEAPON_ORDER = ["wood", "stone", "iron", "bow", "axe"];

// ---------- monster roster ----------
// zombie/skeleton/spider/creeper are the familiar Minecraft Dungeons cast,
// each tweaked a little; slime and ghost are new additions Ben asked for.
var MONSTER_TYPES = {
  zombie:   { name:"Grumble Zombie", emoji:"🧟", hp:6, speed:34,  dmg:1, ranged:false, erratic:false, fuse:false, splits:false, color:"#5b8a4a" },
  skeleton: { name:"Bony Archer",    emoji:"💀", hp:4, speed:26,  dmg:1, ranged:true,  erratic:false, fuse:false, splits:false, color:"#d8d0b0", shootRange:220, shootCooldown:1800 },
  spider:   { name:"Web Spider",     emoji:"🕷️", hp:3, speed:52,  dmg:1, ranged:false, erratic:true,  fuse:false, splits:false, color:"#5a3d7a" },
  creeper:  { name:"Boom Creeper",   emoji:"🧨", hp:4, speed:28,  dmg:2, ranged:false, erratic:false, fuse:true,  splits:false, color:"#5ad16a" },
  slime:    { name:"Slime Blob",     emoji:"🟢", hp:4, speed:24,  dmg:1, ranged:false, erratic:false, fuse:false, splits:true,  color:"#3fd08a" },
  ghost:    { name:"Ghost Puff",     emoji:"👻", hp:2, speed:36,  dmg:1, ranged:false, erratic:true,  fuse:false, splits:false, color:"#cfefff" },
};
var MONSTER_ORDER = ["zombie", "skeleton", "spider", "creeper", "slime", "ghost"];

var TOTAL_WAVES = 3;
var WAVE_SIZES = [3, 4, 5];
var PLAYER_MAX_HP = 20; // 10 hearts
var PLAYER_SPEED = 130; // px/sec
var INVULN_MS = 800;
var CREEPER_FUSE_MS = 1100;
var CREEPER_TRIGGER_RADIUS = 34;
var CREEPER_BLAST_RADIUS = 50;

// ---------- save state (persisted) ----------
var SAVE_KEY = "dungeoncrawl_save_v1";
function defaultSave(){
  return { emeralds: 0, ownedWeapons: ["wood"], equippedWeapon: "wood" };
}
function loadSave(){
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    var parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.ownedWeapons)) return defaultSave();
    return parsed;
  } catch (e) { return defaultSave(); }
}
function persistSave(save){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}

// ---------- pure helper functions (unit-testable) ----------

// Minecraft-style hearts: PLAYER_MAX_HP/2 hearts total, each worth 2 HP.
function heartsDisplay(hp, maxHp){
  var totalHearts = maxHp / 2;
  var hearts = [];
  var remaining = Math.max(0, hp);
  for (var i = 0; i < totalHearts; i++){
    if (remaining >= 2) { hearts.push("full"); remaining -= 2; }
    else if (remaining >= 1) { hearts.push("half"); remaining -= 1; }
    else hearts.push("empty");
  }
  return hearts;
}

// rng is injectable so tests can be deterministic.
function rollDrop(rng){
  rng = rng || Math.random;
  var r = rng();
  if (r < 0.55) return "emerald";
  if (r < 0.75) return "heart";
  return null;
}

function waveSize(waveNum){
  var idx = Math.max(0, Math.min(WAVE_SIZES.length - 1, waveNum - 1));
  return WAVE_SIZES[idx];
}

function pickWaveMonsters(waveNum, rng){
  rng = rng || Math.random;
  var n = waveSize(waveNum);
  var picks = [];
  for (var i = 0; i < n; i++){
    var idx = Math.floor(rng() * MONSTER_ORDER.length);
    picks.push(MONSTER_ORDER[idx]);
  }
  return picks;
}

function canBuyWeapon(save, weaponId){
  var w = WEAPONS[weaponId];
  if (!w) return false;
  if (save.ownedWeapons.indexOf(weaponId) !== -1) return false;
  return save.emeralds >= w.cost;
}
function buyWeapon(save, weaponId){
  if (!canBuyWeapon(save, weaponId)) return false;
  var w = WEAPONS[weaponId];
  save.emeralds -= w.cost;
  save.ownedWeapons.push(weaponId);
  save.equippedWeapon = weaponId;
  return true;
}
function equipWeapon(save, weaponId){
  if (save.ownedWeapons.indexOf(weaponId) === -1) return false;
  save.equippedWeapon = weaponId;
  return true;
}

// Splitting slimes: only an original (unsplit) slime splits, into 2 smaller
// ones that can't split again — prevents infinite slime spam.
function splitSlimeChildren(monster){
  var childHp = Math.max(1, Math.ceil(monster.maxHp / 2));
  var children = [];
  for (var i = 0; i < 2; i++){
    children.push({
      type: monster.type, hp: childHp, maxHp: childHp,
      x: monster.x + (i === 0 ? -10 : 10), y: monster.y,
      canSplit: false,
    });
  }
  return children;
}

function applyDamageToPlayer(player, dmg, nowMs){
  if (player.invulnUntil && nowMs < player.invulnUntil) return false;
  player.hp = Math.max(0, player.hp - dmg);
  player.invulnUntil = nowMs + INVULN_MS;
  return true;
}

// Melee hit-check only (pure) — caller applies damage/removal separately.
function monstersInRange(px, py, range, monsters){
  return monsters.filter(function (m) {
    var dx = m.x - px, dy = m.y - py;
    return Math.sqrt(dx * dx + dy * dy) <= range;
  });
}

// ---------- hub: Builder sprite (little Minecraft-ish villager) ----------
function drawBuilder(){
  var canvas = document.getElementById("builderCanvas");
  if (!canvas) return;
  var c = canvas.getContext("2d");
  c.clearRect(0, 0, 90, 110);
  c.fillStyle = "#6b4a2f"; c.fillRect(28, 30, 34, 55); // robe
  c.fillStyle = "#8a6a3f"; c.fillRect(28, 30, 34, 16); // apron top
  c.fillStyle = "#e8b98a"; c.fillRect(33, 8, 24, 24);  // head
  c.fillStyle = "#3a2a1a"; c.fillRect(33, 8, 24, 6);   // hair
  c.fillStyle = "#2a2040"; c.fillRect(38, 20, 3, 3); c.fillRect(49, 20, 3, 3); // eyes
  c.fillStyle = "#4a3a20"; c.fillRect(40, 26, 10, 5); // nose/mouth block
  c.fillStyle = "#e8b98a"; c.fillRect(20, 34, 8, 26); c.fillRect(62, 34, 8, 26); // arms
  c.fillStyle = "#3a2a1a"; c.fillRect(28, 85, 12, 16); c.fillRect(50, 85, 12, 16); // legs
}

// ---------- Minecraft-ish blocky player sprite ----------
function drawPlayer(c, p){
  var x = p.x, y = p.y;
  var facing = p.facing || "down";
  var flip = facing === "left";
  var walkOffset = p.moving ? Math.sin(p.animT * 8) * 4 : 0;
  var flashHidden = p.invulnUntil && p.invulnActive && Math.floor(p.animT * 10) % 2 === 0;
  if (flashHidden) return;

  c.save();
  c.translate(x, y);
  if (flip) c.scale(-1, 1);

  // legs (walk animation)
  c.fillStyle = "#3a4a8a";
  c.fillRect(-9, 10 + walkOffset, 7, 14);
  c.fillRect(2, 10 - walkOffset, 7, 14);

  // torso
  c.fillStyle = "#3fae6b";
  c.fillRect(-10, -8, 20, 20);

  // arms (one swings on attack)
  c.fillStyle = "#e8b98a";
  var swing = p.attackAnimT != null ? Math.max(0, 1 - p.attackAnimT / 180) : 0;
  c.save();
  c.translate(11, -6);
  c.rotate(-swing * 1.4);
  c.fillRect(0, 0, 6, 14);
  c.restore();
  c.fillRect(-17, -6, 6, 14);

  // head
  c.fillStyle = "#e8b98a";
  c.fillRect(-9, -26, 18, 18);
  c.fillStyle = "#4a2a1a";
  c.fillRect(-9, -26, 18, 5); // hair
  c.fillStyle = "#2a2040";
  c.fillRect(-5, -16, 3, 3);
  c.fillRect(3, -16, 3, 3); // eyes (front-facing look)

  c.restore();
}

// =====================================================================
// The functions above are pure/DOM-only and safe to unit-test directly.
// Everything below wires up the live hub + dungeon game loop.
// =====================================================================

var save = loadSave();

function refreshHubUI(){
  document.getElementById("hubEmeraldCount").textContent = save.emeralds;
  var w = WEAPONS[save.equippedWeapon] || WEAPONS.wood;
  document.getElementById("equippedWeaponLabel").textContent = w.name + " " + w.emoji;
  drawBuilder();
}
refreshHubUI();

function showScreen(id){
  document.querySelectorAll(".screen").forEach(function (s) { s.classList.remove("active"); });
  document.getElementById(id).classList.add("active");
}

// ---------- shop ----------
function renderShop(){
  document.getElementById("shopEmeraldCount").textContent = save.emeralds;
  var list = document.getElementById("shopList");
  list.innerHTML = "";
  WEAPON_ORDER.forEach(function (id) {
    var w = WEAPONS[id];
    var owned = save.ownedWeapons.indexOf(id) !== -1;
    var row = document.createElement("div");
    row.className = "shopItem";
    var statsText = (w.ranged ? "Ranged · " : "Melee · ") + "⚔️" + w.dmg + " dmg";
    row.innerHTML =
      '<div class="icon">' + w.emoji + '</div>' +
      '<div class="info"><div class="wname">' + w.name + '</div><div class="wstats">' + statsText + '</div></div>';
    var btn = document.createElement("button");
    if (owned){
      btn.className = "equipBtn" + (save.equippedWeapon === id ? " equipped" : "");
      btn.textContent = save.equippedWeapon === id ? "Equipped" : "Equip";
      btn.disabled = save.equippedWeapon === id;
      btn.addEventListener("click", function () {
        equipWeapon(save, id);
        persistSave(save);
        renderShop();
        refreshHubUI();
      });
    } else {
      btn.className = "buyBtn";
      btn.textContent = "💎" + w.cost;
      btn.disabled = !canBuyWeapon(save, id);
      btn.addEventListener("click", function () {
        if (buyWeapon(save, id)){
          persistSave(save);
          renderShop();
          refreshHubUI();
        }
      });
    }
    row.appendChild(btn);
    list.appendChild(row);
  });
}
document.getElementById("builderBtn").addEventListener("click", function () {
  renderShop();
  document.getElementById("shopOverlay").classList.add("show");
});
document.getElementById("shopCloseBtn").addEventListener("click", function () {
  document.getElementById("shopOverlay").classList.remove("show");
});

// ---------- dungeon game state ----------
var dCanvas = document.getElementById("dungeonCanvas");
var dCtx = dCanvas.getContext("2d");
var ARENA_W = 320, ARENA_H = 400, MARGIN = 26;

var run = null; // active dungeon run state, null when not in a dungeon
var rafId = null;

function newRun(){
  return {
    player: { x: ARENA_W / 2, y: ARENA_H / 2, hp: PLAYER_MAX_HP, maxHp: PLAYER_MAX_HP, facing: "down", moving: false, animT: 0, invulnUntil: 0, invulnActive: false, attackCooldownUntil: 0, attackAnimT: null },
    monsters: [],
    arrows: [],
    drops: [],
    wave: 0,
    waveEmeraldsThisRun: 0,
    heartsThisRun: 0,
    lastTs: null,
    nextId: 1,
    ended: false,
  };
}

function spawnWave(r, waveNum){
  var types = pickWaveMonsters(waveNum);
  types.forEach(function (type, i) {
    var def = MONSTER_TYPES[type];
    var edge = Math.floor(Math.random() * 4);
    var x, y;
    if (edge === 0) { x = MARGIN; y = MARGIN + Math.random() * (ARENA_H - MARGIN * 2); }
    else if (edge === 1) { x = ARENA_W - MARGIN; y = MARGIN + Math.random() * (ARENA_H - MARGIN * 2); }
    else if (edge === 2) { x = MARGIN + Math.random() * (ARENA_W - MARGIN * 2); y = MARGIN; }
    else { x = MARGIN + Math.random() * (ARENA_W - MARGIN * 2); y = ARENA_H - MARGIN; }
    r.monsters.push({
      id: r.nextId++, type: type, x: x, y: y, hp: def.hp, maxHp: def.hp,
      canSplit: def.splits, fuseStartedAt: null, lastShotAt: 0, jitterX: 0, jitterY: 0,
    });
  });
  r.wave = waveNum;
  document.getElementById("waveLabel").textContent = "Wave " + waveNum + "/" + TOTAL_WAVES;
  flashWaveBanner("Wave " + waveNum + "!");
}

function flashWaveBanner(text){
  var el = document.getElementById("waveBanner");
  el.textContent = text;
  el.classList.add("show");
  setTimeout(function () { el.classList.remove("show"); }, 1100);
}

function startDungeon(){
  run = newRun();
  showScreen("screen-dungeon");
  spawnWave(run, 1);
  renderHearts();
  document.getElementById("emeraldHud").textContent = "💎 " + save.emeralds;
  run.lastTs = null;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(gameLoop);
}

function renderHearts(){
  var hearts = heartsDisplay(run.player.hp, run.player.maxHp);
  var el = document.getElementById("heartsRow");
  el.innerHTML = hearts.map(function (state) {
    var glyph = state === "full" ? "❤️" : state === "half" ? "🧡" : "🖤";
    return '<span style="font-size:0.95rem;">' + glyph + '</span>';
  }).join("");
}

// ---------- movement input ----------
var heldDirs = {};
document.querySelectorAll(".dpad button").forEach(function (btn) {
  var dir = btn.dataset.dir;
  function press(e){ e.preventDefault(); heldDirs[dir] = true; btn.classList.add("pressed"); }
  function release(e){ if (e) e.preventDefault(); heldDirs[dir] = false; btn.classList.remove("pressed"); }
  btn.addEventListener("pointerdown", press);
  btn.addEventListener("pointerup", release);
  btn.addEventListener("pointerleave", release);
});
window.addEventListener("keydown", function (e) {
  var map = { ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right", w:"up", s:"down", a:"left", d:"right" };
  if (map[e.key]) heldDirs[map[e.key]] = true;
  if (e.key === " ") performAttack();
});
window.addEventListener("keyup", function (e) {
  var map = { ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right", w:"up", s:"down", a:"left", d:"right" };
  if (map[e.key]) heldDirs[map[e.key]] = false;
});
document.getElementById("attackBtn").addEventListener("pointerdown", function (e) {
  e.preventDefault();
  this.classList.add("pressed");
  performAttack();
});
document.getElementById("attackBtn").addEventListener("pointerup", function () { this.classList.remove("pressed"); });

function performAttack(){
  if (!run || run.ended) return;
  var nowMs = performance.now();
  if (nowMs < run.player.attackCooldownUntil) return;
  var weapon = WEAPONS[save.equippedWeapon] || WEAPONS.wood;
  run.player.attackCooldownUntil = nowMs + weapon.cooldown;
  run.player.attackAnimT = 0;

  if (weapon.ranged){
    var nearest = null, nearestDist = Infinity;
    run.monsters.forEach(function (m) {
      var dx = m.x - run.player.x, dy = m.y - run.player.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < nearestDist && dist <= weapon.range) { nearest = m; nearestDist = dist; }
    });
    if (nearest){
      var dx = nearest.x - run.player.x, dy = nearest.y - run.player.y;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      run.arrows.push({ x: run.player.x, y: run.player.y, vx: (dx / len) * 320, vy: (dy / len) * 320, dmg: weapon.dmg });
    }
  } else {
    var hits = monstersInRange(run.player.x, run.player.y, weapon.range, run.monsters);
    hits.forEach(function (m) { damageMonster(m, weapon.dmg); });
  }
}

function damageMonster(m, dmg){
  m.hp -= dmg;
  if (m.hp <= 0) killMonster(m);
}

function killMonster(m){
  var idx = run.monsters.indexOf(m);
  if (idx !== -1) run.monsters.splice(idx, 1);
  if (m.canSplit){
    splitSlimeChildren(m).forEach(function (child) {
      child.id = run.nextId++;
      child.fuseStartedAt = null; child.lastShotAt = 0; child.jitterX = 0; child.jitterY = 0;
      run.monsters.push(child);
    });
  }
  var drop = rollDrop();
  if (drop) run.drops.push({ id: run.nextId++, type: drop, x: m.x, y: m.y });
  checkWaveClear();
}

function checkWaveClear(){
  if (run.monsters.length > 0) return;
  if (run.wave >= TOTAL_WAVES){
    endRun(true);
  } else {
    setTimeout(function () {
      if (!run || run.ended) return;
      spawnWave(run, run.wave + 1);
    }, 900);
  }
}

function collectDrop(drop){
  if (drop.type === "emerald"){
    save.emeralds += 1;
    run.waveEmeraldsThisRun += 1;
  } else if (drop.type === "heart"){
    run.player.hp = Math.min(run.player.maxHp, run.player.hp + 1);
    run.heartsThisRun += 1;
  }
  persistSave(save);
  document.getElementById("emeraldHud").textContent = "💎 " + save.emeralds;
}

function endRun(victory){
  if (!run || run.ended) return;
  run.ended = true;
  if (rafId) cancelAnimationFrame(rafId);
  document.getElementById("resultTitle").textContent = victory ? "🏆 Dungeon Complete!" : "😵 Knocked Out!";
  document.getElementById("resultLine1").textContent = "💎 Emeralds collected: " + run.waveEmeraldsThisRun;
  document.getElementById("resultLine2").textContent = victory
    ? "Great job clearing all " + TOTAL_WAVES + " waves!"
    : "No worries — you keep everything you collected. Try again!";
  document.getElementById("resultOverlay").classList.add("show");
}
document.getElementById("resultBackBtn").addEventListener("click", function () {
  document.getElementById("resultOverlay").classList.remove("show");
  run = null;
  showScreen("screen-hub");
  refreshHubUI();
});
document.getElementById("leaveDungeonBtn").addEventListener("click", function () {
  if (rafId) cancelAnimationFrame(rafId);
  run = null;
  showScreen("screen-hub");
  refreshHubUI();
});

// ---------- game loop ----------
function gameLoop(ts){
  if (!run || run.ended) return;
  if (run.lastTs == null) run.lastTs = ts;
  var dt = Math.min(0.05, (ts - run.lastTs) / 1000);
  run.lastTs = ts;

  updatePlayer(dt, ts);
  updateMonsters(dt, ts);
  updateArrows(dt);
  updateDrops();
  draw();

  rafId = requestAnimationFrame(gameLoop);
}

function updatePlayer(dt, ts){
  var p = run.player;
  var vx = 0, vy = 0;
  if (heldDirs.up) vy -= 1;
  if (heldDirs.down) vy += 1;
  if (heldDirs.left) vx -= 1;
  if (heldDirs.right) vx += 1;
  p.moving = vx !== 0 || vy !== 0;
  if (p.moving){
    var len = Math.sqrt(vx * vx + vy * vy);
    vx /= len; vy /= len;
    if (Math.abs(vx) > Math.abs(vy)) p.facing = vx < 0 ? "left" : "right";
    else p.facing = vy < 0 ? "up" : "down";
    p.x = Math.max(MARGIN, Math.min(ARENA_W - MARGIN, p.x + vx * PLAYER_SPEED * dt));
    p.y = Math.max(MARGIN, Math.min(ARENA_H - MARGIN, p.y + vy * PLAYER_SPEED * dt));
    p.animT += dt;
  }
  p.invulnActive = ts < p.invulnUntil;
  if (p.attackAnimT != null){
    p.attackAnimT += dt * 1000;
    if (p.attackAnimT > 180) p.attackAnimT = null;
  }
}

function updateMonsters(dt, ts){
  run.monsters.forEach(function (m) {
    var def = MONSTER_TYPES[m.type];
    var dx = run.player.x - m.x, dy = run.player.y - m.y;
    var dist = Math.sqrt(dx * dx + dy * dy) || 1;

    if (def.fuse){
      if (dist <= CREEPER_TRIGGER_RADIUS){
        if (m.fuseStartedAt == null) m.fuseStartedAt = ts;
        else if (ts - m.fuseStartedAt >= CREEPER_FUSE_MS){
          var stillClose = dist <= CREEPER_BLAST_RADIUS;
          if (stillClose) applyDamageToPlayer(run.player, def.dmg, ts);
          killMonster(m);
          return;
        }
      } else {
        m.fuseStartedAt = null;
      }
    } else if (def.ranged){
      if (dist > def.shootRange * 0.7){
        moveToward(m, dx, dy, dist, def.speed, dt);
      }
      if (dist <= def.shootRange && ts - m.lastShotAt > def.shootCooldown){
        m.lastShotAt = ts;
        run.arrows.push({ x: m.x, y: m.y, vx: (dx / dist) * 200, vy: (dy / dist) * 200, dmg: def.dmg, hostile: true });
      }
    } else {
      if (def.erratic){
        m.jitterX += (Math.random() - 0.5) * 60 * dt;
        m.jitterY += (Math.random() - 0.5) * 60 * dt;
        m.jitterX = Math.max(-30, Math.min(30, m.jitterX));
        m.jitterY = Math.max(-30, Math.min(30, m.jitterY));
      }
      moveToward(m, dx + m.jitterX, dy + m.jitterY, Math.sqrt(Math.pow(dx + m.jitterX, 2) + Math.pow(dy + m.jitterY, 2)) || 1, def.speed, dt);
      if (dist < 16){
        applyDamageToPlayer(run.player, def.dmg, ts);
      }
    }
  });
  renderHearts();
  if (run.player.hp <= 0) endRun(false);
}

function moveToward(m, dx, dy, dist, speed, dt){
  m.x += (dx / dist) * speed * dt;
  m.y += (dy / dist) * speed * dt;
  m.x = Math.max(MARGIN, Math.min(ARENA_W - MARGIN, m.x));
  m.y = Math.max(MARGIN, Math.min(ARENA_H - MARGIN, m.y));
}

function updateArrows(dt){
  var ts = performance.now();
  run.arrows = run.arrows.filter(function (a) {
    a.x += a.vx * dt; a.y += a.vy * dt;
    if (a.x < 0 || a.x > ARENA_W || a.y < 0 || a.y > ARENA_H) return false;
    if (a.hostile){
      var dx = a.x - run.player.x, dy = a.y - run.player.y;
      if (Math.sqrt(dx * dx + dy * dy) < 14){
        applyDamageToPlayer(run.player, a.dmg, ts);
        return false;
      }
    } else {
      var hitMonster = null;
      for (var i = 0; i < run.monsters.length; i++){
        var m = run.monsters[i];
        var mdx = a.x - m.x, mdy = a.y - m.y;
        if (Math.sqrt(mdx * mdx + mdy * mdy) < 16) { hitMonster = m; break; }
      }
      if (hitMonster){ damageMonster(hitMonster, a.dmg); return false; }
    }
    return true;
  });
}

function updateDrops(){
  run.drops = run.drops.filter(function (d) {
    var dx = d.x - run.player.x, dy = d.y - run.player.y;
    if (Math.sqrt(dx * dx + dy * dy) < 18){
      collectDrop(d);
      return false;
    }
    return true;
  });
}

// ---------- rendering ----------
function draw(){
  dCtx.clearRect(0, 0, ARENA_W, ARENA_H);
  dCtx.fillStyle = "#2a2040";
  dCtx.fillRect(0, 0, ARENA_W, ARENA_H);
  dCtx.fillStyle = "#3d3358";
  for (var gx = 0; gx < ARENA_W; gx += 40){
    for (var gy = 0; gy < ARENA_H; gy += 40){
      if (((gx / 40) + (gy / 40)) % 2 === 0) dCtx.fillRect(gx, gy, 40, 40);
    }
  }
  dCtx.strokeStyle = "#544a78";
  dCtx.lineWidth = MARGIN * 2;
  dCtx.strokeRect(0, 0, ARENA_W, ARENA_H);

  run.drops.forEach(function (d) {
    dCtx.font = "18px sans-serif";
    dCtx.textAlign = "center"; dCtx.textBaseline = "middle";
    dCtx.fillText(d.type === "emerald" ? "💎" : "❤️", d.x, d.y);
  });

  run.monsters.forEach(function (m) {
    var def = MONSTER_TYPES[m.type];
    var fusing = m.fuseStartedAt != null;
    dCtx.beginPath();
    dCtx.fillStyle = fusing && Math.floor(performance.now() / 100) % 2 === 0 ? "#ffffff" : def.color;
    dCtx.arc(m.x, m.y, 15, 0, Math.PI * 2);
    dCtx.fill();
    dCtx.font = "18px sans-serif";
    dCtx.textAlign = "center"; dCtx.textBaseline = "middle";
    dCtx.fillText(def.emoji, m.x, m.y);
  });

  run.arrows.forEach(function (a) {
    dCtx.fillStyle = a.hostile ? "#ffb0b0" : "#fff5c0";
    dCtx.beginPath();
    dCtx.arc(a.x, a.y, 4, 0, Math.PI * 2);
    dCtx.fill();
  });

  if (run.player.attackAnimT != null){
    var weapon = WEAPONS[save.equippedWeapon] || WEAPONS.wood;
    dCtx.strokeStyle = weapon.color;
    dCtx.lineWidth = 3;
    dCtx.beginPath();
    dCtx.arc(run.player.x, run.player.y, weapon.range, 0, Math.PI * 2);
    dCtx.globalAlpha = Math.max(0, 1 - run.player.attackAnimT / 180) * 0.5;
    dCtx.stroke();
    dCtx.globalAlpha = 1;
  }

  drawPlayer(dCtx, run.player);
}

// ---------- nav wiring ----------
document.getElementById("enterDungeonBtn").addEventListener("click", startDungeon);
</script>
